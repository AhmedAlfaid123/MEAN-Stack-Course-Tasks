<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.5;
            padding: 2rem 1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #666;
        }

        .form,
        .search {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-radius: 12px;
            border: 2px dotted #666;
            margin: 10px;
            padding: 10px;
        }

        button {
            grid-column: 1 / -1;
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 8px;
            background: #040508;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .users {
            margin: 10px;
            width: 100%;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        thead th {
            background: #1a1a1a;
            color: #fff;
            text-align: left;
            padding: 0.75rem 0.8rem;
            font-size: 0.95rem;
        }

        thead th:nth-child(1) {
            width: 22%;
        }

        thead th:nth-child(2) {
            width: 22%;
        }

        thead th:nth-child(3) {
            width: 10%;
        }

        thead th:nth-child(4) {
            width: 20%;
        }

        thead th:nth-child(5) {
            width: 26%;
        }

        tbody td {
            padding: 0.7rem 0.8rem;
            height: 50px;
            border-bottom: 1px solid #666;
            font-size: 0.95rem;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            grid-column: auto;
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .actions .update {
            background: #2e7d32;
        }

        .actions .delete {
            background: #c62828;
        }
    </style>
</head>

<body>
    <div class="form" id="form">
        <input type="text" name="fname" id="fname" placeholder="Enter first name">
        <input type="text" name="lname" id="lname" placeholder="Enter last name">
        <input type="number" name="age" id="age" placeholder="Enter age">
        <input type="text" name="graduate" id="graduate" placeholder="Enter graduation status">
        <button id="add">Add user</button>
    </div>

    <div class="search" id="search">
        <input type="text" name="byName" id="byName" placeholder="Search by name of user">
        <input type="text" name="byGraduate" id="byGraduate" placeholder="Search by graduation status">
        <button type="button" id="sBtn">Search</button>
    </div>
    <div class="users" id="users">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Graduate</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userData">
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
