<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Evaluation</title>
    <style>
        :root {
            --bg: #fafafa;
            --fg: #1a1a1a;
            --muted: #888;
            --line: #e5e5e5;
            --accent: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 48px 24px;
            max-width: 420px;
            margin: 0 auto;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--fg);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            margin-top: 4px;
            padding: 11px 12px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.85;
        }

        #eval {
            width: 100%;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        #eval > div {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 8px 0;
        }

        #eval > div:not(:last-child) {
            border-bottom: 1px solid var(--line);
        }

        #eval > div::before {
            content: attr(id);
            color: var(--muted);
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <input type="text" name="username" id="username" placeholder="Enter your name">
    <input type="number" name="age" id="age" placeholder="Enter your age">
    <input type="number" name="experience" id="experience" placeholder="Enter your years of experience">
    <button onclick="submit()">Submit</button>
    <div id="eval">
        <div id="level"></div>
        <div id="performance"></div>
        <div id="bonus"></div>
        <div id="salary"></div>
        <div id="shift"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
